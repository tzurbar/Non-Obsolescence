name = "non-obsolescence"
main = "worker/index.js"
compatibility_date = "2026-08-23"

# Serves the static site; worker/index.js handles the one dynamic route
# (/api/submit-guide) and falls back to this binding for everything else.
# Used both by `wrangler deploy` (production, via Cloudflare's dashboard)
# and `npm run dev:functions` (`wrangler dev`, local testing) - same code
# path in both places, so what works locally works in production.
[assets]
directory = "./dist"
binding = "ASSETS"

# Non-secret config, safe to commit - unlike dashboard-only "Runtime
# variables", these live in the repo so they deploy with every push and
# can't get silently wiped out by a Cloudflare-triggered rebuild.
# TRANSLATION_API_KEY stays dashboard-only (Secret) since it must never be
# committed to git.
[vars]
TRANSLATION_API_URL = "https://api.openai.com/v1/chat/completions"
TRANSLATION_MODEL = "gpt-4o-mini"
